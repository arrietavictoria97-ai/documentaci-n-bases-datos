site_name: Manuales de Bases de Datos
site_description: Guías de instalación y primera práctica de MongoDB y MySQL en Ubuntu
site_language: es
nav:
  - Inicio: index.md
  - MongoDB (NoSQL): mongodb.md
  - MySQL (SQL): mysql.md
theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.details
plugins:
  - search
